[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alien-terminal"
version = "0.6.0"
description = "An autonomous AI agent that roleplays as an extraterrestrial intelligence observing humanity"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matthew Watkins" }]
requires-python = ">=3.11"
keywords = ["ai", "agent", "autonomous", "persona", "x-twitter", "fastapi", "alien"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "httpx>=0.27",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/SoCtrilogy/Alien-Terminal"

[tool.setuptools.packages.find]
include = ["alien_terminal*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
